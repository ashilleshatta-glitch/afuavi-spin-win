<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Spin & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #ff6b9d;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .table-container {
            background: var(--surface);
            border-radius: 1rem;
            overflow: auto;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.2rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-dim);
            text-align: left;
        }

        td {
            padding: 1.2rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .badge-redeemed {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .code-val {
            font-family: monospace;
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        #errorBox {
            margin-top: 1.5rem;
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body>

    <!-- MAIN DASHBOARD -->
    <header>
        <h1>Winners Dashboard</h1>
        <div style="display:flex; gap:10px">
            <button class="action-btn" onclick="fetchWinners()"
                style="padding: 0.5rem 1rem; font-size: 0.85rem; width: auto; background: rgba(255,255,255,0.1); border: 1px solid var(--border)">Refresh
                Data</button>
        </div>
    </header>

    <div class="container">
        <div id="errorBox"></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="20%">Date & Time</th>
                        <th width="25%">Winner Email/ID</th>
                        <th width="15%">Prize</th>
                        <th width="20%">Discount Code</th>
                        <th width="10%">Status</th>
                        <th width="10%">Action</th>
                    </tr>
                </thead>
                <tbody id="winnerTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center; padding: 4rem; color: var(--text-dim)">Fetching
                            campaign data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const errorBox = document.getElementById('errorBox');
        const tableBody = document.getElementById('winnerTableBody');

        async function fetchWinners() {
            errorBox.style.display = 'none';

            try {
                const response = await fetch('/api/admin/winners');

                if (!response.ok) {
                    showError(`Server Error: API is missing. Please ensure src/routes.js is updated on GitHub.`);
                    return;
                }

                const result = await response.json();
                renderTable(result.data);

            } catch (err) {
                showError(`Connection Failed: The server might still be restarting. Wait 30 seconds and try again.`);
            }
        }

        async function markRedeemed(code) {
            if (!confirm(`Mark code ${code} as redeemed?`)) return;
            try {
                const res = await fetch('/api/admin/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discount_code: code })
                });
                if (res.ok) fetchWinners();
                else alert("Could not update. Try again.");
            } catch (e) { alert("Network error."); }
        }

        function renderTable(winners) {
            if (!winners || winners.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:4rem; color:var(--text-dim)">No winners recorded in the database yet.</td></tr>';
                return;
            }

            tableBody.innerHTML = winners.map(w => {
                const time = new Date(w.created_at).toLocaleString();
                const isUsed = !!w.redeemed_at;
                return `
                    <tr>
                        <td style="font-size: 0.85rem; color: var(--text-dim)">${time}</td>
                        <td style="font-weight: 600; color: #fff">${w.email}</td>
                        <td style="font-weight: 700; color: var(--primary)">${w.prize_label}</td>
                        <td><span class="code-val">${w.discount_code}</span></td>
                        <td><span class="badge ${isUsed ? 'badge-redeemed' : 'badge-pending'}">${isUsed ? 'Redeemed' : 'Active'}</span></td>
                        <td>
                            ${isUsed ? '<span style="opacity:0.3; font-size:0.8rem">Finished</span>' : `<button class="action-btn" onclick="markRedeemed('${w.discount_code}')">Claim</button>`}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        // Initial Load
        fetchWinners();

    </script>
</body>

</html>
