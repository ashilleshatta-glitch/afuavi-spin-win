<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Spin & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #ff6b9d;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .login-card {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            text-align: center;
            width: 350px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        input {
            width: 100%;
            padding: 0.8rem;
            margin: 1rem 0;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            background: #000;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: transform 0.1s;
        }

        button.primary-btn:active {
            transform: scale(0.98);
        }

        button.primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .table-container {
            background: var(--surface);
            border-radius: 1rem;
            overflow: auto;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-dim);
            text-align: left;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .badge {
            padding: 0.3rem 0.7rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }

        .badge-redeemed {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .redeem-btn {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        .redeem-btn:hover {
            background: var(--success);
            color: white;
        }

        .code-text {
            font-family: monospace;
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .hidden {
            display: none !important;
        }

        #debugInfo {
            margin-top: 1.5rem;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0.5rem;
            font-size: 0.75rem;
            color: #ef4444;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="margin-top:0">Admin Access</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Password: <b>admin123</b></p>

            <input type="password" id="adminPass" placeholder="Enter Password" autocomplete="current-password">
            <button class="primary-btn" id="loginBtn">Access Dashboard</button>

            <div id="debugInfo" class="hidden"></div>
        </div>
    </div>

    <header>
        <h1>Winners & Prizes</h1>
        <div style="display:flex; gap:10px">
            <button onclick="fetchWinners()"
                style="background:none; color:var(--text); border:1px solid var(--border); padding:0.5rem 1rem; border-radius:0.5rem; cursor:pointer">Refresh</button>
            <button onclick="logout()"
                style="background:none; color:var(--text-dim); border:none; cursor:pointer">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date/Time</th>
                        <th>Winner Email</th>
                        <th>Prize Won</th>
                        <th>Discount Code</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="winnersTable">
                    <tr>
                        <td colspan="6" style="text-align:center; color:var(--text-dim)">Loading winners...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const passInput = document.getElementById('adminPass');
        const debugInfo = document.getElementById('debugInfo');
        const overlay = document.getElementById('loginOverlay');
        const tableBody = document.getElementById('winnersTable');

        let currentPass = localStorage.getItem('spin_admin_pass') || '';

        // Handle Access Button
        loginBtn.addEventListener('click', () => {
            currentPass = passInput.value;
            if (!currentPass) return alert("Please enter the password.");
            fetchWinners();
        });

        // Handle Enter Key
        passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginBtn.click(); });

        async function fetchWinners() {
            loginBtn.disabled = true;
            loginBtn.textContent = "Checking...";
            debugInfo.classList.add('hidden');

            try {
                const res = await fetch('/api/admin/winners', {
                    headers: { 'x-admin-password': currentPass }
                });

                if (res.status === 401) {
                    showError("Incorrect Password. Try 'admin123'");
                    return;
                }

                if (!res.ok) {
                    showError(`Server Error: ${res.status} ${res.statusText}`);
                    return;
                }

                const json = await res.json();
                renderTable(json.data);

                // If we get here, login worked
                overlay.classList.add('hidden');
                localStorage.setItem('spin_admin_pass', currentPass);

            } catch (err) {
                showError(`Connection Failed: ${err.message}. Is the server running?`);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "Access Dashboard";
            }
        }

        async function markRedeemed(code) {
            if (!confirm(`Mark ${code} as redeemed?`)) return;
            try {
                await fetch('/api/admin/redeem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-password': currentPass },
                    body: JSON.stringify({ discount_code: code })
                });
                fetchWinners();
            } catch (e) { alert("Failed to update status."); }
        }

        function renderTable(winners) {
            if (!winners || winners.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:3rem; color:var(--text-dim)">No winners found yet.</td></tr>';
                return;
            }

            tableBody.innerHTML = winners.map(w => {
                const date = new Date(w.created_at).toLocaleString();
                const isRedeemed = !!w.redeemed_at;

                return `
                    <tr>
                        <td style="color:var(--text-dim); font-size:0.85rem">${date}</td>
                        <td style="font-weight:600">${w.email}</td>
                        <td style="color:var(--primary); font-weight:700">${w.prize_label}</td>
                        <td><span class="code-text">${w.discount_code}</span></td>
                        <td><span class="badge ${isRedeemed ? 'badge-redeemed' : 'badge-pending'}">${isRedeemed ? 'Redeemed' : 'Active'}</span></td>
                        <td>
                            ${isRedeemed ? '<span style="opacity:0.3">Done</span>' : `<button class="redeem-btn" onclick="markRedeemed('${w.discount_code}')">Mark Used</button>`}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function showError(msg) {
            debugInfo.textContent = msg;
            debugInfo.classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('spin_admin_pass');
            location.reload();
        }

        // Auto-login if we have a saved pass
        if (currentPass) fetchWinners();

    </script>
</body>

</html>
