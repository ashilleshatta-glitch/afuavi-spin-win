<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Spin & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #ff6b9d;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .login-card {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            text-align: center;
            width: 320px;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin: 1rem 0;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            background: #000;
            color: white;
            box-sizing: border-box;
        }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        /* Winners Table */
        .table-container {
            background: var(--surface);
            border-radius: 1rem;
            overflow: auto;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-win {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .badge-redeemed {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .redeem-btn {
            background: transparent;
            border: 1px solid var(--success);
            color: var(--success);
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .redeem-btn:hover {
            background: var(--success);
            color: white;
        }

        .code {
            font-family: monospace;
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .hidden {
            display: none !important;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
        }

        .stat-val {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>Admin Login</h2>
            <p style="color: grey; font-size: 0.85rem;">Enter password to view winners</p>
            <input type="password" id="adminPass" placeholder="Password">
            <button class="primary-btn" onclick="login()">Access Dashboard</button>
            <p id="loginError" style="color: #ff6b9d; margin-top: 1rem;" class="hidden">Incorrect password</p>
        </div>
    </div>

    <header>
        <h1>Winners Dashboard</h1>
        <div style="display: flex; gap: 10px;">
            <button onclick="fetchWinners()"
                style="padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); border-radius: 0.5rem; cursor: pointer;">Refresh</button>
            <button onclick="logout()"
                style="padding: 0.5rem 1rem; background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: 0.5rem; cursor: pointer;">Logout</button>
        </div>
    </header>

    <div class="container" id="mainDashboard">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Winners</div>
                <div class="stat-val" id="countWinners">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Remaining Slots</div>
                <div class="stat-val" id="countRemaining">15</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Winner ID/Email</th>
                        <th>Prize</th>
                        <th>Code</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="winnersTable">
                    <!-- Rows will be added here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let adminPassword = localStorage.getItem('admin_pass') || '';

        async function fetchWinners() {
            try {
                const response = await fetch('/api/admin/winners', {
                    headers: { 'x-admin-password': adminPassword }
                });

                if (response.status === 401) {
                    showLogin();
                    return;
                }

                const data = await response.json();
                renderWinners(data.data);
                hideLogin();
            } catch (err) {
                console.error("Fetch failed", err);
            }
        }

        async function markAsRedeemed(code) {
            if (!confirm(`Mark code ${code} as redeemed?`)) return;

            try {
                const response = await fetch('/api/admin/redeem', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': adminPassword
                    },
                    body: JSON.stringify({ discount_code: code })
                });

                if (response.ok) {
                    fetchWinners(); // Refresh table
                } else {
                    alert("Redemption failed. Check console.");
                }
            } catch (err) {
                console.error("Redemption failed", err);
            }
        }

        function renderWinners(winners) {
            const tbody = document.getElementById('winnersTable');
            tbody.innerHTML = '';

            document.getElementById('countWinners').textContent = winners.length;
            document.getElementById('countRemaining').textContent = Math.max(0, 15 - winners.length);

            winners.forEach(w => {
                const date = new Date(w.created_at).toLocaleString();
                const status = w.redeemed_at
                    ? `<span class="badge badge-redeemed">Redeemed</span>`
                    : `<span class="badge badge-pending">Waiting</span>`;

                const action = w.redeemed_at
                    ? `<span style="opacity: 0.3; font-size: 0.8rem">Done</span>`
                    : `<button class="redeem-btn" onclick="markAsRedeemed('${w.discount_code}')">Redeem</button>`;

                const row = `
                    <tr>
                        <td style="font-size: 0.85rem; color: var(--text-dim)">${date}</td>
                        <td style="font-size: 0.9rem">${w.email}</td>
                        <td style="font-weight: 600">${w.prize_label}</td>
                        <td><span class="code">${w.discount_code}</span></td>
                        <td>${status}</td>
                        <td>${action}</td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function login() {
            const pass = document.getElementById('adminPass').value;
            adminPassword = pass;
            fetchWinners();
        }

        function showLogin() {
            document.getElementById('loginOverlay').classList.remove('hidden');
            if (adminPassword) document.getElementById('loginError').classList.remove('hidden');
        }

        function hideLogin() {
            document.getElementById('loginOverlay').classList.add('hidden');
            localStorage.setItem('admin_pass', adminPassword);
        }

        function logout() {
            localStorage.removeItem('admin_pass');
            location.reload();
        }

        // Initial Load
        if (adminPassword) {
            fetchWinners();
        }
    </script>
</body>

</html>
