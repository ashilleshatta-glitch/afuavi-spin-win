<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Spin & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #ff6b9d;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .stat-val {
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 0.5rem;
            color: #fff;
        }

        .stat-val.primary {
            color: var(--primary);
        }

        .table-container {
            background: var(--surface);
            border-radius: 1rem;
            overflow: auto;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.2rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-dim);
            text-align: left;
        }

        td {
            padding: 1.2rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .badge-redeemed {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        #liveIndicator {
            font-size: 0.75rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }
        }

        #errorBox {
            margin-top: 1.5rem;
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1 style="margin-bottom: 4px;">Live Management Dashboard</h1>
            <div id="liveIndicator"><span class="dot"></span> Connection Active: Listening for Spins...</div>
        </div>
        <button class="action-btn" onclick="fetchWinners()"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border)">Manual Refresh</button>
    </header>

    <div class="container">
        <div id="errorBox"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Visitors (Potential)</div>
                <div class="stat-val primary" id="statVisitors">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Actual Spins Performed</div>
                <div class="stat-val" id="statSpins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Confirmed Winners</div>
                <div class="stat-val" id="statWinners">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Prizes Left</div>
                <div class="stat-val" id="statRemaining">15</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="20%">Date & Time</th>
                        <th width="25%">Winner Email/ID</th>
                        <th width="15%">Prize Won</th>
                        <th width="20%">Unique Discount Code</th>
                        <th width="10%">Status</th>
                        <th width="10%">Action</th>
                    </tr>
                </thead>
                <tbody id="winnerTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center; padding: 4rem; color: var(--text-dim)">Initializing
                            live feed...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('winnerTableBody');
        const errorBox = document.getElementById('errorBox');

        async function fetchWinners() {
            try {
                const response = await fetch('/api/admin/winners');
                if (!response.ok) throw new Error("Server not responding correctly.");

                const result = await response.json();

                // Update Numeric Stats
                document.getElementById('statVisitors').textContent = result.data.stats.total_customers;
                document.getElementById('statSpins').textContent = result.data.stats.total_spins;
                document.getElementById('statWinners').textContent = result.data.winners.length;
                document.getElementById('statRemaining').textContent = Math.max(0, 15 - result.data.winners.length);

                renderTable(result.data.winners);
                errorBox.style.display = 'none';

            } catch (err) {
                console.error(err);
                errorBox.textContent = "Sync Error: Check your Render logs.";
                errorBox.style.display = 'block';
            }
        }

        async function markRedeemed(code) {
            if (!confirm(`Mark code ${code} as redeemed?`)) return;
            await fetch('/api/admin/redeem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ discount_code: code })
            });
            fetchWinners();
        }

        function renderTable(winners) {
            if (!winners || winners.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:4rem; color:var(--text-dim)">No winners found yet.</td></tr>';
                return;
            }
            tableBody.innerHTML = winners.map(w => {
                const time = new Date(w.created_at).toLocaleString();
                const isUsed = !!w.redeemed_at;
                return `
                    <tr>
                        <td style="font-size:0.85rem">${time}</td>
                        <td style="font-weight:600">${w.email}</td>
                        <td style="color:var(--primary); font-weight:700">${w.prize_label}</td>
                        <td style="font-family:monospace; font-weight:bold">${w.discount_code}</td>
                        <td><span class="badge ${isUsed ? 'badge-redeemed' : 'badge-pending'}">${isUsed ? 'Redeemed' : 'Active'}</span></td>
                        <td>${isUsed ? '' : `<button class="action-btn" onclick="markRedeemed('${w.discount_code}')">Redeem</button>`}</td>
                    </tr>
                `;
            }).join('');
        }

        setInterval(fetchWinners, 5000); // Check every 5 seconds for ultimate precision
        fetchWinners();
    </script>
</body>

</html>
